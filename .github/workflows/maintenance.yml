name: Weekly catalog maintenance

on:
  schedule:
    - cron: '23 8 * * 1' # Monday, 08:23 UTC, away from the start of the hour.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.event.repository.fork == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs all six CI commands, probes fixed contracts, writes the summary and reconciles issues.
      - run: pnpm maintenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
